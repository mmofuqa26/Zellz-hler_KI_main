# CellCounter Pro - Configuration & Preset File
# Laboranten können Presets direkt bearbeiten oder über die UI speichern.

default_preset: "Standard_Brightfield"

presets:
  Standard_Brightfield:
    description: "Standard Hellfeldmikroskopie für allgemeine Zellkulturen (z.B. HEK293, HeLa)"
    preprocessing:
      max_dimension: 2048
      clahe_clip_limit: 2.0
      clahe_tile_grid_size: [8, 8]
      gaussian_blur_kernel: 5
    segmentation:
      min_cell_diameter_px: 15
      max_cell_diameter_px: 120
      adaptive_thresh_block_size: 21
      adaptive_thresh_c: 5
      min_marker_area_px: 3        # Verhindert Übersegmentierung bei unregelmäßigen Maxima
      dist_threshold_ratio: 0.25    # Schwellenwert-Faktor für Distanz-Transformation
      min_circularity: 0.35
      min_solidity: 0.50
    viability:
      enabled: true
      ring_width_px: 4              # Lokale Hintergrund-Ringbreite um den Zellkern
      intensity_diff_threshold: -12.0 # Lokale Intensitätsdifferenz (I_core - I_ring)
                                    # Negativ -> Kern dunkler als Rand = Farbstoffaufnahme (Tot)

  Trypan_Blue_Viability:
    description: "Optimiert für Trypanblau-Farbausschluss-Tests"
    preprocessing:
      max_dimension: 2048
      clahe_clip_limit: 2.5
      clahe_tile_grid_size: [8, 8]
      gaussian_blur_kernel: 5
    segmentation:
      min_cell_diameter_px: 12
      max_cell_diameter_px: 100
      adaptive_thresh_block_size: 25
      adaptive_thresh_c: 4
      min_marker_area_px: 4
      dist_threshold_ratio: 0.30
      min_circularity: 0.30
      min_solidity: 0.45
    viability:
      enabled: true
      ring_width_px: 5
      intensity_diff_threshold: -15.0

  High_Density_Yeast:
    description: "Optimiert für sehr kleine, dichte Hefe-Zellen oder Bakterien-Cluster"
    preprocessing:
      max_dimension: 2560
      clahe_clip_limit: 3.0
      clahe_tile_grid_size: [4, 4]
      gaussian_blur_kernel: 3
    segmentation:
      min_cell_diameter_px: 6
      max_cell_diameter_px: 40
      adaptive_thresh_block_size: 15
      adaptive_thresh_c: 3
      min_marker_area_px: 2
      dist_threshold_ratio: 0.40
      min_circularity: 0.40
      min_solidity: 0.60
    viability:
      enabled: false
      ring_width_px: 3
      intensity_diff_threshold: -10.0

database:
  db_path: "data/cell_counter.db"
  check_same_thread: false

logging:
  log_file: "logs/cell_counter.log"
  log_level: "INFO"
  max_bytes: 5242880  # 5 MB per file
  backup_count: 3
